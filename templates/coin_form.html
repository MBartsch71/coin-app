<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a coin</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
</head>
<body>
    <main>
        <header>
            <h1>Add a coin</h1>
            <p><a href="/">\<- back to collection</a></p>
        </header>

        <form method="post" action="/coins">
            <section>
                <h2>1. Which coin?</h2>
                <label for="ref-search">Search your catalog</label>
                <input type="search" id="ref-search" name="q"
                    placeholder="e.g. Krügerrand"
                    hx-get="/partials/references/search"
                    hx-trigger="keyup changed delay:300ms"
                    hx-target="#reference-select"
                    hx-swap="innerHTML">
                <div id="reference-select">
                    <select name="reference_id">
                        <option value="" disabled selected>- type to search your catalog... -</option>
                    </select>
                </div>

                <fieldset>
                    <legend>...or catalog it as new</legend>
                    <label for="ref_title">Title</label>
                    <input type="text" name="ref_title" 
                           placeholder="Title (e.g. Krügerrand 1 oz)"
                           hx-get="/partials/references/search"
                           hx-trigger="keyup changed delay:300ms"
                           hx-target="reference-select"
                           hx-swap="innerHTML">

                    <label for="ref_country">Country</label>
                    <input type="text" name="ref_country" placeholder="Country">

                    <label for="ref_metal">Metal</label>
                    <select name="ref_metal" required>
                        <option>Gold</option>
                        <option>Silver</option>
                        <option>Copper</option>
                        <option>Platinum</option>
                        <option>Palladium</option>
                        <option>Other</option>
                    </select>
                </fieldset>
            </section>

            <section>
                <h2>2. Your coin</h2>
                <label for="year">Year</label>
                <input type="number" name="year" placeholder="Year" required>

                <label for="quantity">Quantity</label>
                <input type="number" name="quantity" value="1" min="1" required>

                <div class="row">
                    <div>
                        <label for="purchase_price">Purchase price</label>
                        <input type="number" name="purchase_price" step="0.01" min="0" value="0" required>
                    </div>
                    <div>
                        <label for="purchase_currency">Currency</label>
                        <input type="text" name="purchase_currency" value="CHF">
                    </div>
                </div>

                <label for="dealer">Dealer (optional)</label>
                <input type="text" name="dealer" placeholder="e.g. Philoro">

                <label for="mint_mark">Mint mark (optional)</label>
                <input type="text" name="mint_mark" placeholder="e.g. P, D, or T">

                <label for="grade">Grade (optional)</label>
                <input type="text" name="grade" placeholder="e.g. MS-65">

                <label for="storage_location_id">Storage location (optional)</label>
                <input type="number" name="storage_location_id" placeholder="Location ID">
            </section>

            <button type="submit">Add to collection</button>
        </form>
    </main>
</body>
</html>
