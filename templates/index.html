<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
</head>
<body>
    <h1>{{title}}</h1>
    <p class="muted">{{message}}</p>

    <section>
        <h2>My collection</h2>
        <div id="coin-list"
            hx-get="/coins"
            hx-trigger="load"
            hx-target="#coin-list"
            hx-swap="innerHTML">
            <p class="muted">Loading coins...</p>
        </div>
        <p class="actions"><a class="button" href="/coins/new">+ Add a coin</a></p>
    </section>
</body>
</html>
